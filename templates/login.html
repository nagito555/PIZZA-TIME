{% extends 'base.html' %}
{% block title %}Вход — PizzaPoint{% endblock %}
{% block content %}
<div class="container auth-page"><section class="auth-card"><p class="eyebrow">РАДЫ ВИДЕТЬ ТЕБЯ</p><h1>Вход в аккаунт</h1><p class="form-intro">Для входа нужны электронная почта и пароль.</p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
<label for="email">Электронная почта</label><input id="email" name="email" type="email" required autofocus autocomplete="username">
<label for="password">Пароль</label><input id="password" name="password" type="password" required autocomplete="current-password">
<label class="remember"><input type="checkbox" name="remember"> Запомнить меня</label><button class="btn btn-primary btn-wide" type="submit">Войти</button></form><p class="switch-auth">Нет аккаунта? <a href="{{ url_for('register', next=next_url) }}">Зарегистрироваться</a></p></section></div>
{% endblock %}

{% extends 'admin/base.html' %}{% block title %}Позиция меню — админ{% endblock %}{% block admin_content %}<p class="eyebrow">КАТАЛОГ</p><h1>{{ 'Редактировать пиццу' if product else 'Новая пицца' }}</h1><form class="panel admin-form" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Название</label><input name="name" value="{{ product.name if product else '' }}" required><label>Категория</label><input name="category" list="category-list" value="{{ product.category_name if product else '' }}" required><datalist id="category-list">{% for category in categories %}<option value="{{ category.name }}">{% endfor %}</datalist><label>Описание / состав</label><textarea name="description" rows="3" required>{{ product.description if product else '' }}</textarea><label>Цена, ₽</label><input name="price" type="number" min="0" value="{{ product.price if product else '' }}" required><label>URL изображения</label><input name="image_url" type="url" value="{{ product.image_url if product else '' }}"><label class="remember"><input type="checkbox" name="is_available" {% if not product or product.is_available %}checked{% endif %}> Отображать в меню</label><div class="form-actions"><button class="btn btn-primary" type="submit">Сохранить</button><a class="btn btn-outline" href="{{ url_for('admin.menu') }}">Отмена</a></div></form>{% endblock %}
